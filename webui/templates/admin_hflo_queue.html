{% extends "admin_base.html" %}

{% block content %}
<h1 class="admin-title">HFLO Review Queue</h1>

<div class="card">
    <h2>Pending HFLO Upgrades</h2>
    <p>
        These items were generated by Solomon’s HFLO engine and need your approval before they can
        modify skills or patch planner logic.
    </p>

    <div id="queueContainer" class="queue-grid">
        <!-- Loaded dynamically -->
    </div>
</div>

<style>
    /* Phase 17 unified theme */

    .queue-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
    }

    .queue-item {
        background: var(--bg-panel);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text-bright);
        transition: border 0.2s ease, background 0.2s ease;
    }

    .queue-item:hover {
        border-color: var(--pri-light);
        background: var(--bg-panel-hover);
    }

    .queue-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .queue-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    /* Unified button variants */
    .btn {
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        border: none;
    }

    .btn-success {
        background: var(--success);
        color: #000;
    }

    .btn-danger {
        background: var(--danger);
        color: #fff;
    }

    .btn-muted {
        background: var(--bg-muted);
        color: var(--text-muted);
    }

    .code-block {
        background: var(--bg-card);
        padding: 12px;
        border-radius: 8px;
        color: var(--text-code);
        white-space: pre;
        overflow-x: auto;
        margin-top: 10px;
        border: 1px solid var(--border);
    }

    .item-meta {
        font-size: 0.9rem;
        margin-top: 12px;
        color: var(--text-muted);
    }

    /* Unified badge variants */
    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        color: #fff;
        font-weight: 600;
    }

    .badge-pending {
        background: var(--pri);
    }

    .badge-approved {
        background: var(--success);
    }

    .badge-rejected {
        background: var(--danger);
    }

</style>

<script src="{{ url_for('static', filename='js/admin_hflo_queue.js') }}"></script>

{% endblock %}
