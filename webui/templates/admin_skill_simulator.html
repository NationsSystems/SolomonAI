{% extends "admin_base.html" %}

{% block content %}
<h1 class="admin-title">Skill Simulation Lab</h1>

<div class="card">
    <h2>Simulate Proposed Skill Code</h2>
    <p>Safely test a skill's Python code inside a restricted sandbox before allowing HFLO to install it.</p>

    <form id="simulateForm" onsubmit="return false;" class="sim-form">
        <label>Skill Name (optional)</label>
        <input type="text" id="skill_name" placeholder="e.g., summarize_text_v2">

        <label>Python Code</label>
        <textarea id="python_code" class="code-input" placeholder="Paste proposed skill code here..." required></textarea>

        <label>Test Input (JSON)</label>
        <textarea id="test_input" class="json-input" placeholder='{"text": "example"}'></textarea>

        <button class="btn btn-accent btn-run" onclick="runSimulation()">Run Simulation</button>
    </form>

    <div id="resultPanel" class="result-panel" style="display:none;">
        <h3>Simulation Result</h3>
        <pre id="resultOutput" class="result-output"></pre>
    </div>
</div>

<style>
/* ================================
   Phase 17 Unified Theme
   ================================ */

.card {
    background: var(--bg-panel);
    padding: 24px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-top: 20px;
    color: var(--text-normal);
}

.card h2 {
    margin-top: 0;
    color: var(--text-bright);
}

/* Form layout */
.sim-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 10px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-normal);
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.9rem;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--pri);
}

.code-input {
    height: 220px;
    white-space: pre;
}

.json-input {
    height: 140px;
}

/* Run Button */
.btn-run {
    width: 200px;
    margin-top: 5px;
}

/* Result Panel */
.result-panel {
    margin-top: 30px;
    background: var(--bg-panel);
    padding: 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
}

.result-panel h3 {
    margin-top: 0;
    color: var(--text-bright);
}

.result-output {
    white-space: pre-wrap;
    color: var(--text-code);
    font-family: monospace;
    background: var(--bg-card);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
}
</style>

<script>
async function runSimulation() {
    const skill_name = document.getElementById("skill_name").value;
    const python_code = document.getElementById("python_code").value;
    const test_raw = document.getElementById("test_input").value;

    let test_input = {};
    if (test_raw.trim() !== "") {
        try {
            test_input = JSON.parse(test_raw);
        } catch (e) {
            alert("Test input must be valid JSON.");
            return;
        }
    }

    const response = await fetch("/admin/skill_simulator/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            skill_name,
            python_code,
            test_input
        })
    });

    const data = await response.json();

    const panel = document.getElementById("resultPanel");
    const output = document.getElementById("resultOutput");

    panel.style.display = "block";
    output.textContent = JSON.stringify(data, null, 4);
}
</script>

{% endblock %}
